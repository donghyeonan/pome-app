    <!-- Seeds -->
    <circle cx="0" cy="-10" r="4" fill="#E63946"/>
    <circle cx="5" cy="0" r="4" fill="#E63946"/>
    <circle cx="0" cy="10" r="4" fill="#E63946"/>
    <circle cx="5" cy="20" r="4" fill="#E63946"/>
    <circle cx="0" cy="30" r="4" fill="#E63946"/>
  </g>
